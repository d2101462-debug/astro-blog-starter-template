<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northstar Page Editor</title>
<style>
body{font-family:Arial;margin:0;background:#eef3f8;color:#173452}.wrap{max-width:700px;margin:40px auto;padding:25px;background:white;border-radius:8px;box-shadow:0 5px 25px #0001}h1{margin-top:0}label{display:block;font-weight:700;margin:18px 0}input{width:100%;padding:11px;margin-top:7px;box-sizing:border-box}button{padding:12px 18px;border:0;border-radius:5px;background:#1261c9;color:white;font-weight:700;cursor:pointer;margin-right:8px}.secondary{background:#66788a}.note{padding:12px;background:#fff8df;border:1px solid #ead99a;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Page Editor</h1>
<p class="note">This editor changes the fictional landing page only. It does not collect or manage financial credentials or identity documents.</p>
<label>Organization name<input id="brandName"></label>
<label>Subtitle<input id="brandSubtitle"></label>
<label>Headline<input id="headline"></label>
<label>Description<input id="description"></label>
<label>Logo letter<input id="logo" maxlength="2"></label>
<label>Footer text<input id="footer"></label>
<button onclick="save()">Save changes</button>
<button class="secondary" onclick="resetSettings()">Reset</button>
<p id="status"></p>
</div>
<script>
const keys=["brandName","brandSubtitle","headline","description","logo","footer"];
const defaults={brandName:"Northstar Financial Gateway",brandSubtitle:"Fictional financial services portal",headline:"Secure account access",description:"Use the buttons below to access your fictional account portal.",logo:"N",footer:"© 2026 Northstar Financial Gateway · Fictional demonstration"};
function load(){const s=JSON.parse(localStorage.getItem("northstarSettings")||"null")||defaults;keys.forEach(k=>document.getElementById(k).value=s[k]);}
function save(){const s={};keys.forEach(k=>s[k]=document.getElementById(k).value);localStorage.setItem("northstarSettings",JSON.stringify(s));document.getElementById("status").textContent="Saved. Open the landing page to see the changes."; }
function resetSettings(){localStorage.removeItem("northstarSettings");load();document.getElementById("status").textContent="Reset to defaults."}
load();
</script>
</body>
</html>
